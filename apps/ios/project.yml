name: SAMAL
options:
  bundleIdPrefix: dev.samal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.4.1
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  SAMAL:
    type: application
    platform: iOS
    sources:
      - path: SAMAL
    info:
      path: SAMAL/Info.plist
      properties:
        CFBundleDisplayName: Salam
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Logo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: Salam использует микрофон для голосовых сообщений и звонков.
        NSCameraUsageDescription: Salam использует камеру для фото, видео и видеозвонков.
        NSPhotoLibraryUsageDescription: Salam прикрепляет фото и видео из галереи.
        NSLocationWhenInUseUsageDescription: Salam может отправить геолокацию в чат.
        NSContactsUsageDescription: Salam находит друзей среди контактов телефона.
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.samal.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_LANGUAGE: ru
    dependencies:
      - package: GRDB
        product: GRDB
      - package: LiveKit
        product: LiveKit
