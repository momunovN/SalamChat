services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: samal
      POSTGRES_PASSWORD: samal
      POSTGRES_DB: samal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samal -d samal"]
      interval: 5s
      timeout: 3s
      retries: 20
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=250

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: samal
      MINIO_ROOT_PASSWORD: samalsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          mc alias set local http://minio:9000 samal samalsecret && break
          sleep 1
        done
        mc mb -p local/samal || true
        mc anonymous set download local/samal || true
        echo "minio bucket ready"

  # Optional SFU. Start with: docker compose --profile calls up
  livekit:
    profiles: ["calls"]
    image: livekit/livekit-server:v1.8.3
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  postgres_data:
  minio_data:
